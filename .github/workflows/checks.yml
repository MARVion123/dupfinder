name: Checks

# Runs on every push, which is the point: the product site lives in this
# repository and rots silently while the code moves.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits, so the drift step below can see what changed.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: The package still builds and holds together
        run: python3 tests/test_spk.py

      - name: The installer refuses what it should refuse
        run: python3 tests/test_install_spk.py

      - name: The package picks the interpreter that can do the most
        run: python3 tests/test_start_stop_status.py

      - name: The rule engine keeps the right copy, cheaply
        run: python3 tests/test_suggestions.py

      - name: One tree compared against another
        run: python3 tests/test_compare_trees.py

      - name: Pausing a scan and carrying it on
        run: python3 tests/test_pause_resume.py

      - name: A real scan, start to finish
        # The only test here that runs the whole chain. Adding a column once
        # widened an INSERT and left two other passes writing the old row;
        # every unit test passed and the scan died on the first file.
        run: python3 tests/test_scan_end_to_end.py

      - name: Pillow, which two of the tests need
        # Optional for the tool, required by the tests that exercise the
        # perceptual and video hashes. Without it they abort on an assertion
        # rather than skipping, which is the right behaviour for a test file
        # and the wrong thing to discover in CI.
        run: python3 -m pip install --quiet pillow

      - name: The rest of the suite
        # These ran nowhere until now, which makes a passing test file a
        # decoration rather than a check.
        run: |
          set -e
          for t in tests/test_fuzzy_index.py \
                   tests/test_video_signature.py \
                   tests/test_helper.py; do
            echo "== $t"
            python3 "$t"
          done

      - name: The docs still describe this repository
        run: python3 tools/check_docs.py

      - name: Did the code move without the site?
        # A warning, never a failure. Most commits do not touch anything the
        # site claims, and a check that fails on those would be turned off
        # within a week. This one only asks the question.
        if: github.event_name == 'push'
        run: |
          set -eu
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "No previous commit to compare against; skipping."
            exit 0
          fi
          changed=$(git diff --name-only "$before" "${{ github.sha }}")
          echo "Changed in this push:"
          echo "$changed" | sed 's/^/  /'

          watched=$(echo "$changed" | grep -E '^(install/|dupfinder/|LICENSE|README\.md)' || true)
          docs=$(echo "$changed" | grep -E '^docs/' || true)

          if [ -n "$watched" ] && [ -z "$docs" ]; then
            echo "::warning title=The site may be out of date::This push changed \
          $(echo "$watched" | wc -l) file(s) under install/, dupfinder/, the licence or \
          the README, and nothing under docs/. The mechanical checks passed, but they \
          cannot tell whether the pages still describe what the tool now does. \
          Worth a look: docs/index.html and docs/de/index.html."
          else
            echo "Nothing to flag."
          fi
